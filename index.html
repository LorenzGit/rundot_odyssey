<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
        <meta name="theme-color" content="#3aa6e0" />
        <title>Odyssey: The Perfect Shot</title>
        <style>
            html,
            body,
            #root {
                width: 100%;
                height: 100%;
                margin: 0;
                overflow: hidden;
                background: #3aa6e0;
            }

            #boot-cover {
                position: fixed;
                inset: 0;
                z-index: 99;
                display: grid;
                place-content: center;
                gap: 14px;
                color: #fff8de;
                text-align: center;
                font-family: system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
                letter-spacing: 0.06em;
                /* Same Aegean sky continuum as in-game cover bars — no dark flash. */
                background:
                    radial-gradient(ellipse 70% 50% at 50% 70%, rgb(255 200 80 / 22%), transparent 55%),
                    linear-gradient(180deg, #4db4ef 0%, #3aa6e0 42%, #2a8fc8 72%, #1a6a9a 100%);
                transition: opacity 320ms ease;
                padding:
                    max(24px, env(safe-area-inset-top, 0px))
                    max(24px, env(safe-area-inset-right, 0px))
                    max(24px, env(safe-area-inset-bottom, 0px))
                    max(24px, env(safe-area-inset-left, 0px));
            }

            #boot-cover.hidden {
                opacity: 0;
                pointer-events: none;
            }

            .boot-mark {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 14px;
                color: #ffc33b;
                filter: drop-shadow(0 3px 0 #6a3a0c);
            }

            .boot-mark span {
                display: block;
                width: 36px;
                height: 36px;
                border: 3px solid #ffc33b;
                border-radius: 4px;
                box-sizing: border-box;
                /* Greek-key-ish square meander */
                background:
                    linear-gradient(#ffc33b, #ffc33b) 4px 4px / 12px 3px no-repeat,
                    linear-gradient(#ffc33b, #ffc33b) 4px 4px / 3px 12px no-repeat,
                    linear-gradient(#ffc33b, #ffc33b) 19px 19px / 12px 3px no-repeat,
                    linear-gradient(#ffc33b, #ffc33b) 28px 13px / 3px 12px no-repeat;
            }

            .boot-title {
                font-weight: 900;
                font-size: clamp(28px, 5.5vw, 56px);
                line-height: 1.05;
                text-shadow: 0 3px 0 #0a3a5a;
            }

            .boot-title small {
                display: block;
                margin-top: 8px;
                font-size: 0.42em;
                font-weight: 700;
                letter-spacing: 0.18em;
                color: #fff4c8;
            }

            .boot-status {
                font-size: clamp(13px, 2.2vw, 16px);
                font-weight: 700;
                letter-spacing: 0.14em;
                color: #e8f4ff;
                opacity: 0.9;
            }

            .boot-track {
                width: min(52vw, 360px);
                height: 12px;
                overflow: hidden;
                margin: 4px auto 0;
                border: 3px solid #fff4c4;
                border-radius: 999px;
                background: #0a4a72;
                box-shadow: 0 3px 0 #0a3050;
            }

            .boot-fill {
                width: 42%;
                height: 100%;
                border-radius: inherit;
                background: linear-gradient(90deg, #ffc129, #fff17d);
                animation: load 1.05s ease-in-out infinite alternate;
            }

            @keyframes load {
                from {
                    width: 28%;
                }
                to {
                    width: 94%;
                }
            }

            @media (prefers-reduced-motion: reduce) {
                .boot-fill {
                    animation: none;
                    width: 70%;
                }
            }
        </style>
    </head>
    <body>
        <div id="boot-cover" role="progressbar" aria-label="Loading Odyssey: The Perfect Shot" aria-busy="true">
            <div class="boot-mark" aria-hidden="true"><span></span><span></span></div>
            <div class="boot-title">ODYSSEY<small>THE PERFECT SHOT</small></div>
            <div class="boot-status">DRAWING THE BOW…</div>
            <div class="boot-track"><div class="boot-fill"></div></div>
        </div>
        <div id="root"></div>
        <!--
            Boot watchdog.

            Every recovery path in this game lives inside the module bundle: the
            boot() catch, the host handshake timeout, the asset timeouts. All of
            them need that bundle to have executed. When it never fetches, never
            parses, or throws at import time on an old WebView, none of it runs
            and #boot-cover stays up forever with no way out.

            A classic script on purpose: it must run even when the module graph
            is the thing that failed.

            It does NOT decide failure on elapsed time alone. A slow connection
            and a dead bundle look identical to a stopwatch, and firing on the
            slow one would tell a player their game is broken while it is still
            downloading. Instead the certain signals act immediately — the
            script's own error event, and an uncaught module-evaluation error —
            and the clock is only a last-resort backstop, held off while the
            network is still delivering bytes.

            Outcomes are recorded to localStorage rather than reported here: a
            boot that failed this badly has no analytics module to report with.
            The next successful boot picks the record up and emits it.
        -->
        <script>
            (function () {
                var SLOW_MS = 8000;      // "this is taking a while", not a failure
                var BACKSTOP_MS = 60000; // last resort, only once fetching has stopped
                var CEILING_MS = 180000; // absolute cap, for a connection that hangs open
                var QUIET_MS = 30000;    // no bytes and no repaint for this long = stalled
                var lastMutationAt = Date.now();
                var KEY = "odyssey:boot-failure:v1";
                var boot = (window.__boot = {
                    startedAt: Date.now(),
                    slowMs: null,
                    outcome: null,
                    settled: false,
                });

                function elapsed() { return Date.now() - boot.startedAt; }

                // The game paints load progress into the cover; every repaint is
                // proof the bundle is running, which no network metric can show.
                try {
                    var cover0 = document.getElementById("boot-cover");
                    if (cover0 && window.MutationObserver) {
                        new MutationObserver(function () { lastMutationAt = Date.now(); })
                            .observe(cover0, { subtree: true, childList: true, characterData: true, attributes: true });
                    }
                } catch (_) { /* observation is best-effort */ }

                function coverUp() {
                    var c = document.getElementById("boot-cover");
                    return !!c && !c.classList.contains("hidden");
                }

                /**
                 * Has anything happened recently?
                 *
                 * Three independent signs of life, because each alone lies:
                 *  - `readyState` goes "complete" while lazy chunks are still
                 *    being imported, so it under-reports.
                 *  - the resource timeline records only COMPLETED requests, so a
                 *    chunk in flight for 30s leaves a hole that looks idle.
                 *  - so the decisive one is the boot cover itself: the game
                 *    paints progress into it as it loads, and any mutation there
                 *    proves the bundle is running and advancing.
                 *
                 * Reading a quiet moment as "dead" is the exact false positive
                 * this watchdog must not produce, so any one of the three counts
                 * as alive.
                 */
                function recentlyAlive() {
                    if (document.readyState !== "complete") return true;
                    if (Date.now() - lastMutationAt < QUIET_MS) return true;
                    try {
                        var e = performance.getEntriesByType("resource");
                        var last = 0;
                        for (var i = 0; i < e.length; i++) {
                            var end = e[i].responseEnd || e[i].startTime || 0;
                            if (end > last) last = end;
                        }
                        return e.length > 0 && performance.now() - last < QUIET_MS;
                    } catch (_) { return false; }
                }

                function persist(reason) {
                    try {
                        window.localStorage.setItem(KEY, JSON.stringify({
                            reason: reason, elapsed_ms: elapsed(), at: new Date().toISOString(),
                        }));
                    } catch (_) { /* private mode; the UI still recovers */ }
                }

                function fail(reason) {
                    if (boot.settled || !coverUp()) return;
                    boot.settled = true;
                    boot.outcome = reason;
                    persist(reason);
                    var cover = document.getElementById("boot-cover");
                    var copy = cover.querySelector(".boot-status");
                    if (copy) copy.textContent = "COULD NOT LOAD";
                    var bar = cover.querySelector(".boot-track");
                    if (bar && bar.parentNode) bar.parentNode.removeChild(bar);
                    var panel = cover.querySelector(".boot-panel") || cover;
                    var hint = document.createElement("p");
                    hint.textContent = "Check your connection and reload.";
                    hint.style.cssText = "margin:10px 0 0;font-size:13px;opacity:.8";
                    var retry = document.createElement("button");
                    retry.type = "button";
                    retry.textContent = "RELOAD";
                    retry.style.cssText =
                        "margin-top:14px;min-height:44px;padding:0 22px;font:inherit;font-size:14px;" +
                        "cursor:pointer;border:1px solid currentColor;border-radius:8px;" +
                        "background:transparent;color:inherit";
                    retry.addEventListener("click", function () { window.location.reload(); });
                    panel.appendChild(hint);
                    panel.appendChild(retry);
                    cover.setAttribute("aria-busy", "false");
                }

                // Certain signal 1: the module bundle never arrived.
                document.addEventListener("error", function (e) {
                    var t = e.target;
                    if (t && t.tagName === "SCRIPT" && t.type === "module") fail("script_load_error");
                }, true);

                // Certain signal 2: it arrived and threw while evaluating.
                window.addEventListener("error", function (e) {
                    if (boot.settled || !coverUp()) return;
                    if (e && e.message) fail("script_eval_error");
                });

                // Slow, but still alive — recorded, never shown as a failure.
                window.setTimeout(function () {
                    if (!boot.settled && coverUp()) boot.slowMs = SLOW_MS;
                }, SLOW_MS);

                // Backstop: only when nothing has arrived for a long while.
                boot.timer = window.setTimeout(function tick() {
                    if (boot.settled || !coverUp()) return;
                    if (recentlyAlive() && elapsed() < CEILING_MS) {
                        boot.timer = window.setTimeout(tick, 10000);
                        return;
                    }
                    fail(elapsed() >= CEILING_MS ? "ceiling" : "timeout");
                }, BACKSTOP_MS);
            })();
        </script>
        <script type="module" src="./src/main.tsx"></script>
    </body>
</html>
