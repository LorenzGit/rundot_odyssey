<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
        <meta name="theme-color" content="#3aa6e0" />
        <title>Odyssey: The Perfect Shot</title>
        <style>
            html,
            body,
            #root {
                width: 100%;
                height: 100%;
                margin: 0;
                overflow: hidden;
                background: #3aa6e0;
            }

            #boot-cover {
                position: fixed;
                inset: 0;
                z-index: 99;
                display: grid;
                place-content: center;
                gap: 14px;
                color: #fff8de;
                text-align: center;
                font-family: system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
                letter-spacing: 0.06em;
                /* Same Aegean sky continuum as in-game cover bars — no dark flash. */
                background:
                    radial-gradient(ellipse 70% 50% at 50% 70%, rgb(255 200 80 / 22%), transparent 55%),
                    linear-gradient(180deg, #4db4ef 0%, #3aa6e0 42%, #2a8fc8 72%, #1a6a9a 100%);
                transition: opacity 320ms ease;
                padding:
                    max(24px, env(safe-area-inset-top, 0px))
                    max(24px, env(safe-area-inset-right, 0px))
                    max(24px, env(safe-area-inset-bottom, 0px))
                    max(24px, env(safe-area-inset-left, 0px));
            }

            #boot-cover.hidden {
                opacity: 0;
                pointer-events: none;
            }

            .boot-mark {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 14px;
                color: #ffc33b;
                filter: drop-shadow(0 3px 0 #6a3a0c);
            }

            .boot-mark span {
                display: block;
                width: 36px;
                height: 36px;
                border: 3px solid #ffc33b;
                border-radius: 4px;
                box-sizing: border-box;
                /* Greek-key-ish square meander */
                background:
                    linear-gradient(#ffc33b, #ffc33b) 4px 4px / 12px 3px no-repeat,
                    linear-gradient(#ffc33b, #ffc33b) 4px 4px / 3px 12px no-repeat,
                    linear-gradient(#ffc33b, #ffc33b) 19px 19px / 12px 3px no-repeat,
                    linear-gradient(#ffc33b, #ffc33b) 28px 13px / 3px 12px no-repeat;
            }

            .boot-title {
                font-weight: 900;
                font-size: clamp(28px, 5.5vw, 56px);
                line-height: 1.05;
                text-shadow: 0 3px 0 #0a3a5a;
            }

            .boot-title small {
                display: block;
                margin-top: 8px;
                font-size: 0.42em;
                font-weight: 700;
                letter-spacing: 0.18em;
                color: #fff4c8;
            }

            .boot-status {
                font-size: clamp(13px, 2.2vw, 16px);
                font-weight: 700;
                letter-spacing: 0.14em;
                color: #e8f4ff;
                opacity: 0.9;
            }

            .boot-track {
                width: min(52vw, 360px);
                height: 12px;
                overflow: hidden;
                margin: 4px auto 0;
                border: 3px solid #fff4c4;
                border-radius: 999px;
                background: #0a4a72;
                box-shadow: 0 3px 0 #0a3050;
            }

            .boot-fill {
                width: 42%;
                height: 100%;
                border-radius: inherit;
                background: linear-gradient(90deg, #ffc129, #fff17d);
                animation: load 1.05s ease-in-out infinite alternate;
            }

            @keyframes load {
                from {
                    width: 28%;
                }
                to {
                    width: 94%;
                }
            }

            @media (prefers-reduced-motion: reduce) {
                .boot-fill {
                    animation: none;
                    width: 70%;
                }
            }
        </style>
    </head>
    <body>
        <div id="boot-cover" role="progressbar" aria-label="Loading Odyssey: The Perfect Shot" aria-busy="true">
            <div class="boot-mark" aria-hidden="true"><span></span><span></span></div>
            <div class="boot-title">ODYSSEY<small>THE PERFECT SHOT</small></div>
            <div class="boot-status">DRAWING THE BOW…</div>
            <div class="boot-track"><div class="boot-fill"></div></div>
        </div>
        <div id="root"></div>
        <!--
            Boot watchdog.

            Every other recovery path in this game lives inside main.tsx: the
            boot() catch, the asset timeout, the late-host watcher. All of them
            require the module bundle to have executed. When the bundle itself
            never fetches, never parses, or throws at import time on an old
            WebView, none of that code runs and #boot-cover stays up forever
            with an animating progress bar and no way out — which is exactly
            what two players reported as "stuck loading" / "doesn't load up".

            This is a classic script on purpose: it must run even when the
            module graph is the thing that failed. It never hides a real boot,
            only a boot that has already stopped happening.
        -->
        <script>
            (function () {
                var GRACE_MS = 20000;
                var timer = window.setTimeout(function () {
                    var cover = document.getElementById("boot-cover");
                    if (!cover || cover.classList.contains("hidden")) return;
                    var status = cover.querySelector(".boot-status");
                    if (status) status.textContent = "COULD NOT LOAD";
                    var track = cover.querySelector(".boot-track");
                    if (track && track.parentNode) track.parentNode.removeChild(track);
                    var hint = document.createElement("p");
                    hint.textContent = "Check your connection and reload.";
                    var retry = document.createElement("button");
                    retry.type = "button";
                    retry.textContent = "RELOAD";
                    retry.addEventListener("click", function () { window.location.reload(); });
                    cover.appendChild(hint);
                    cover.appendChild(retry);
                    cover.setAttribute("aria-busy", "false");
                }, GRACE_MS);
                // The game clears this as soon as it owns the screen.
                window.__odysseyBootWatchdog = timer;
            })();
        </script>
        <script type="module" src="./src/main.tsx"></script>
    </body>
</html>
